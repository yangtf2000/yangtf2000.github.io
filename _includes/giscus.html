<!-- Giscus 评论 + 表情点赞（data-reactions-enabled=1）-->
<!-- 注意：repo_id / category_id 需您在 GitHub 装好 Giscus 应用后回填到 _config.yml -->
<script src="https://giscus.app/client.js"
        data-repo="{{ site.giscus_repo }}"
        data-repo-id="{{ site.giscus_repo_id }}"
        data-category="General"
        data-category-id="{{ site.giscus_category_id }}"
        data-mapping="pathname"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="dark"
        data-lang="zh-CN"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>
<noscript>评论功能需启用 JavaScript，并在仓库配置 Giscus。</noscript>

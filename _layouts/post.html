---
layout: default
---
<article class="post">
  <div class="post-body">
    {{ content }}
  </div>

  <nav class="post-nav">
    {% if page.previous %}
    <a class="post-nav-item prev" href="{{ page.previous.url | relative_url }}">
      <span class="post-nav-label">← 上一篇</span>
      <span class="post-nav-title">{{ page.previous.title }}</span>
    </a>
    {% endif %}
    {% if page.next %}
    <a class="post-nav-item next" href="{{ page.next.url | relative_url }}">
      <span class="post-nav-label">下一篇 →</span>
      <span class="post-nav-title">{{ page.next.title }}</span>
    </a>
    {% endif %}
  </nav>
</article>

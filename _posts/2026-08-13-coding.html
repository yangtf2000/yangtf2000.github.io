.fbtn small{display:block;color:var(--txt3);font-size:11px;margin-bottom:3px}
.fbtn.nx{text-align:right}
.fbtn[disabled]{opacity:.3;cursor:default}
.donebtn{background:none;border:2px solid var(--green);color:var(--green);border-radius:14px;padding:13px 22px;font-size:14px;font-weight:700;cursor:pointer}
.donebtn.did{background:var(--green);color:#0b0e1a}
@media(max-width:860px){
  #main{padding:16px 16px 70px}
  .topbar{margin:-16px -16px 18px;padding:12px 16px}
  .vs{grid-template-columns:1fr}
}
.overlay{position:fixed;inset:0;background:rgba(5,8,18,.6);backdrop-filter:blur(2px);z-index:45;display:none}
.overlay.show{display:block}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,var(--bg) 72%,rgba(11,14,26,0));margin:-34px -46px 24px;padding:14px 46px;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.navbtn{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line2);color:var(--txt);border-radius:12px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:700;white-space:nowrap}
.navbtn:hover{border-color:var(--cyan);color:#fff}
.navbtn .nb-ic{font-size:16px;color:var(--cyan)}
.curcrs{color:var(--txt2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.curcrs b{color:var(--txt)}
</style>

<div id="app">
  <nav id="side"></nav>
  <main id="main">
    <div class="topbar">
      <button id="navbtn" class="navbtn"><span class="nb-ic">☰</span>课程导航</button>
      <span class="curcrs" id="curcrs"></span>
    </div>
    <div id="content"></div>
  </main>
</div>
<div class="overlay" id="overlay"></div>
<script src="data/m1.js"></script>
<script src="data/m2a.js"></script>
<script src="data/m2b.js"></script>
<script src="data/m2c.js"></script>
<script src="data/m3.js"></script>
<script src="data/m4.js"></script>
<script>
const MODS = {1:"观念篇 · 为什么要懂编程",2:"认知篇 · 编程世界的地图",3:"工具篇 · 把代码跑起来",4:"实践篇 · 寒假做一次"};
const L = window.COURSE || [];
let cur = 0;
const done = new Set(JSON.parse(localStorage.getItem("pk_done")||"[]"));

function buildSide(){
  const side = document.getElementById("side");
  let h = `<div class="logo"><div class="l1">编程课<em>门外看看</em></div><div class="l2">AI 时代 · 大学新生寒假扫盲课</div></div>
  <div class="pbar"><i style="width:${Math.round(done.size/L.length*100)}%"></i></div>
  <div class="ptxt">已完成 ${done.size} / ${L.length} 课</div>`;
  let lastMod = 0;
  L.forEach((les,i)=>{
    if(les.mod!==lastMod){
      if(lastMod) h += `</div>`;
      h += `<div class="mod m${les.mod}"><div class="mod-h"><b></b>模块${"一二三四"[les.mod-1]} · ${MODS[les.mod]}</div>`;
      lastMod = les.mod;
    }
    h += `<div class="nav-it ${i===cur?"on":""} ${done.has(les.id)?"done":""}" onclick="go(${i})"><span class="em">${les.emoji}</span><span>${les.title}</span><span class="dn"></span></div>`;
  });
  h += `</div>`;
  side.innerHTML = h;
}

function render(){
  const les = L[cur];
  let h = `<div class="les-head"><span class="les-mod lm${les.mod}">模块${"一二三四"[les.mod-1]} · ${MODS[les.mod]}</span>
  <div class="les-title">${les.emoji} ${les.title}</div>
  <div class="les-sub">${les.sub}</div></div>`;
  les.cards.forEach(c=>{
    h += `<div class="card ac-${c.ac||"cyan"}"><span class="card-tag">${c.tag}</span><h3>${c.title}</h3>${c.html}</div>`;
  });
  if(les.practice){
    const p = les.practice;
    h += `<div class="practice"><div class="pt">🖐️ 动手试一试</div><div class="pi">${p.intro}</div>`;
    p.tasks.forEach((t,ti)=>{
      h += `<div class="task"><div class="tn">${t.name}</div><div class="td">${t.desc}</div>`;
      if(t.prompt) h += `<div class="prompt"><div class="px">${t.prompt}</div><button class="copy" onclick="cp(this,${cur},${ti})">复制提示词</button></div>`;
      h += `</div>`;
    });
    if(p.pass) h += `<div class="pass">🏆 <b>通关标准：</b>${p.pass}</div>`;
    h += `</div>`;
  }
  h += `<div class="fnav">`;
  h += cur>0 ? `<button class="fbtn" onclick="go(${cur-1})"><small>上一课</small>← ${L[cur-1].title}</button>` : `<button class="fbtn" disabled><small>上一课</small>—</button>`;
  h += `<button class="donebtn ${done.has(les.id)?"did":""}" onclick="mark('${les.id}')">${done.has(les.id)?"✓ 已完成":"标记完成"}</button>`;
  h += cur<L.length-1 ? `<button class="fbtn nx" onclick="go(${cur+1})"><small>下一课</small>${L[cur+1].title} →</button>` : `<button class="fbtn nx" disabled><small>下一课</small>🎓 全部学完</button>`;
  h += `</div>`;
  document.getElementById("content").innerHTML = h;
  document.getElementById("curcrs").innerHTML = `<b>${les.emoji} ${les.title}</b> · 模块${"一二三四"[les.mod-1]}`;
  window.scrollTo(0,0);
}

function openSide(){document.getElementById("side").classList.add("open");document.getElementById("overlay").classList.add("show");}
function closeSide(){document.getElementById("side").classList.remove("open");document.getElementById("overlay").classList.remove("show");}
function go(i){cur=i;buildSide();render();closeSide();}
function mark(id){done.has(id)?done.delete(id):done.add(id);localStorage.setItem("pk_done",JSON.stringify([...done]));buildSide();render();}
function cp(btn,li,ti){
  const txt = L[li].practice.tasks[ti].prompt.replace(/<[^>]+>/g,"");
  navigator.clipboard.writeText(txt).then(()=>{btn.textContent="已复制 ✓";btn.classList.add("ok");setTimeout(()=>{btn.textContent="复制提示词";btn.classList.remove("ok")},1500)});
}
document.getElementById("navbtn").onclick=openSide;
document.getElementById("overlay").onclick=closeSide;
buildSide();render();
</script>
